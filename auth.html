<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | AdmitAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; }
        .form-container { background-color: #1f2937; border: 1px solid #374151; }
        .form-input { background-color: #374151; border: 1px solid #4b5563; color: #d1d5db; }
        .form-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.4); }
        .cta-button { background-color: #4f46e5; transition: background-color 0.3s; }
        .cta-button:hover { background-color: #4338ca; }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <header class="absolute top-0 left-0 w-full p-4">
        <div class="container mx-auto flex justify-between items-center">
             <a href="index.html" class="text-xl font-bold text-white">AdmitAI</a>
             <select id="language-switcher" class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2"></select>
        </div>
    </header>

    <div class="max-w-md w-full">
        
        <!-- Sign In Form -->
        <div id="sign-in-section" class="form-section active">
            <div class="form-container p-8 rounded-xl shadow-2xl">
                <div class="text-center mb-8">
                    <h2 id="signin-title" class="text-2xl font-bold text-white"></h2>
                    <p id="signin-subtitle" class="text-gray-400"></p>
                </div>
                <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                    <div class="space-y-6">
                        <div>
                            <label id="signin-email-label" for="email_signin" class="text-sm font-medium text-gray-300"></label>
                            <input id="email_signin" type="email" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="you@example.com">
                        </div>
                        <div>
                            <label id="signin-password-label" for="password_signin" class="text-sm font-medium text-gray-300"></label>
                            <input id="password_signin" type="password" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="mt-8">
                        <button id="signin-button" type="submit" class="cta-button w-full text-white font-semibold py-3 rounded-md"></button>
                    </div>
                </form>
                <p class="text-center text-sm text-gray-400 mt-8">
                    <span id="signin-prompt"></span>
                    <button id="show-signup-btn" class="font-semibold text-indigo-400 hover:text-indigo-300"></button>
                </p>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div id="sign-up-section" class="form-section">
            <div id="signup-step-1" class="form-section active form-container p-8 rounded-xl shadow-2xl">
                 <div class="text-center mb-6">
                    <h2 id="signup-title-1" class="text-2xl font-bold text-white"></h2>
                    <p id="signup-subtitle-1" class="text-gray-400"></p>
                </div>
                <form id="step1-form" class="space-y-4">
                    <div>
                        <label id="signup-email-label" for="email_signup" class="text-sm font-medium text-gray-300"></label>
                        <input id="email_signup" type="email" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="you@example.com">
                    </div>
                    <div>
                        <label id="signup-password-label" for="password_signup" class="text-sm font-medium text-gray-300"></label>
                        <input id="password_signup" type="password" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="••••••••">
                    </div>
                    <div class="pt-4"><button id="signup-next-btn" type="submit" class="cta-button w-full text-white font-semibold py-3 rounded-md"></button></div>
                </form>
                <p class="text-center text-sm text-gray-400 mt-8">
                    <span id="signup-prompt"></span>
                    <button id="show-signin-btn" class="font-semibold text-indigo-400 hover:text-indigo-300"></button>
                </p>
            </div>

            <div id="signup-step-2" class="form-section form-container p-8 rounded-xl shadow-2xl">
                <div class="text-center mb-6">
                    <h2 id="signup-title-2" class="text-2xl font-bold text-white"></h2>
                    <p id="signup-subtitle-2" class="text-gray-400"></p>
                </div>
                <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="space-y-4">
                    <div>
                        <label id="signup-name-label" for="fullName" class="text-sm font-medium text-gray-300"></label>
                        <input id="fullName" type="text" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="e.g. Rohan Sharma">
                    </div>
                    <div>
                        <label id="signup-phone-label" for="phone" class="text-sm font-medium text-gray-300"></label>
                        <input id="phone" type="tel" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="e.g. 9876543210">
                    </div>
                     <div>
                        <label id="signup-city-label" for="city" class="text-sm font-medium text-gray-300"></label>
                        <input id="city" type="text" required class="form-input w-full p-3 mt-1 rounded-md" placeholder="e.g. Mumbai">
                    </div>
                    <div class="pt-4"><button id="signup-create-btn" type="submit" class="cta-button w-full text-white font-semibold py-3 rounded-md"></button></div>
                </form>
            </div>
        </div>
    </div>

<script src="translations.js"></script>
<script src="main.js"></script>
</body>
</html>
