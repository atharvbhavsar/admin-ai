<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AdmitAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sidebar { background-color: #111827; }
        .sidebar-link { transition: background-color 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #1f2937; border-left-color: #4f46e5; }
    </style>
</head>
<body class="flex h-screen">

    <aside class="sidebar w-64 text-gray-300 p-4 flex-shrink-0 flex flex-col">
        <div class="flex items-center mb-8 flex-shrink-0">
            <div class="bg-indigo-600 w-10 h-10 rounded-lg mr-3 flex items-center justify-center text-white font-bold text-xl">A</div>
            <div><h1 class="font-bold text-white text-lg">AdmitAI</h1><p id="sidebar-subtitle" class="text-xs text-gray-400"></p></div>
        </div>
        <nav id="sidebar-nav" class="flex flex-col space-y-2"></nav>
        <div class="mt-auto flex-shrink-0"><a href="index.html" class="sidebar-link px-4 py-2.5 rounded-r-lg block"><span id="nav-logout"></span></a></div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-10">
            <div><h2 id="dashboard-title" class="text-xl font-bold text-gray-800"></h2></div>
            <div class="flex items-center space-x-4">
                <select id="language-switcher" class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2"></select>
                <div class="w-10 h-10 bg-indigo-200 rounded-full"></div>
            </div>
        </header>

        <div class="p-6 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 flex flex-col space-y-6">
                <div class="bg-gradient-to-r from-pink-500 to-orange-400 text-white p-6 rounded-lg shadow-lg">
                    <h3 id="welcome-title" class="text-2xl font-bold"></h3><p id="welcome-subtitle"></p>
                </div>
                <div id="dashboard-cards" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                <div class="bg-white p-4 rounded-lg shadow-md flex-1"><p id="chat-prompt" class="text-gray-700"></p></div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow-md space-y-8">
                <div>
                    <h4 id="status-title" class="font-bold text-gray-800 mb-4"></h4>
                    <div id="status-list" class="space-y-3 text-sm"></div>
                </div>
                <div>
                    <h4 id="recent-title" class="font-bold text-gray-800 mb-4"></h4>
                    <div id="recent-list" class="space-y-4 text-sm"></div>
                </div>
                <div>
                    <h4 id="stats-title" class="font-bold text-gray-800 mb-2"></h4>
                    <p class="text-3xl font-bold text-indigo-600">1,247</p><p id="stats-desc" class="text-sm text-gray-500"></p>
                </div>
            </div>
        </div>
    </main>

<script src="translations.js"></script>
<script src="main.js"></script>
</body>
</html>
